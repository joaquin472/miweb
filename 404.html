<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Puccetti Ronquillo Asset Management</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/Logotipo_PR_web.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #0a0a0a; --color-bg-light: #111111; --color-text: #f5f5f5;
            --color-text-muted: #888888; --color-accent: #c9a962; --color-border: #2a2a2a;
            --font-serif: 'Cormorant Garamond', serif; --font-sans: 'Inter', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body { font-family:var(--font-sans); background:var(--color-bg); color:var(--color-text);
               line-height:1.7; font-weight:300; display:flex; flex-direction:column; }
        main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
               text-align:center; padding:4rem 5%; }
        .brand { display:inline-block; margin-bottom:3rem; }
        .brand img { width:96px; height:auto; display:block; }
        .label { font-family:var(--font-serif); font-size:.9rem; color:var(--color-accent);
                 letter-spacing:.2em; text-transform:uppercase; display:block; margin-bottom:1rem; }
        h1 { font-family:var(--font-serif); font-size:clamp(2.2rem,5vw,3rem); font-weight:400;
             line-height:1.15; margin-bottom:1rem; }
        p { color:var(--color-text-muted); font-size:.95rem; max-width:34rem; margin:0 auto; }
        p + p { margin-top:.4rem; }
        .divider { width:48px; height:1px; background:var(--color-border); margin:2.5rem auto; }
        .actions { display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; margin-top:2.5rem; }
        .btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px;
               padding:.85rem 1.8rem; border:1px solid var(--color-accent); color:var(--color-accent);
               text-decoration:none; font-size:.8rem; letter-spacing:.12em; text-transform:uppercase;
               transition:background .2s, color .2s; }
        .btn:hover, .btn:focus-visible { background:var(--color-accent); color:var(--color-bg); }
        footer { padding:2rem 5%; border-top:1px solid var(--color-border); text-align:center; }
        .footer-copy { font-size:.78rem; color:var(--color-text-muted); }
    </style>
</head>
<body>

<main>
    <a href="/" class="brand" aria-label="Puccetti Ronquillo Asset Management, inicio">
        <img src="/Logotipo_PR_web.svg" alt="Puccetti Ronquillo Asset Management" width="96" height="72">
    </a>

    <span class="label">Error 404</span>
    <h1>Página no encontrada</h1>
    <p>La página que busca no existe o ha cambiado de dirección.</p>

    <div class="divider" aria-hidden="true"></div>

    <span class="label" lang="en">Error 404</span>
    <h1 lang="en">Page not found</h1>
    <p lang="en">The page you are looking for does not exist or has moved.</p>

    <div class="actions">
        <a href="/" class="btn" hreflang="es">Ir al inicio</a>
        <a href="/index_en" class="btn" hreflang="en" lang="en">Go to homepage</a>
    </div>
</main>

<footer>
    <p class="footer-copy">© 2026 Puccetti Ronquillo Asset Management</p>
</footer>

</body>
</html>
